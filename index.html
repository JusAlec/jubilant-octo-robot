<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QR8 — AI-powered web development agency. We design and build fast, modern sites that turn visitors into paying clients." />
    <meta name="theme-color" content="#F8FAFC" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="QR8 — AI-Powered Web Development" />
    <meta property="og:description" content="Websites that bring customers to your business. Fast, modern sites built in 14 days." />
    <meta property="og:url" content="https://qr8.dev" />
    <meta property="og:site_name" content="QR8" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="QR8 — AI-Powered Web Development" />
    <meta name="twitter:description" content="Websites that bring customers to your business. Fast, modern sites built in 14 days." />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://qr8.dev" />

    <title>QR8 — AI-Powered Web Development</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <script>
      // Apply saved theme before first paint to prevent flash
      (function() {
        var t = localStorage.getItem('qr8-theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
